# Google Maven
# https://maven.google.com/web/index.html?hl=zh-cn

# Gradle Plugins
# https://plugins.gradle.org/

# Maven
# https://mvnrepository.com/

# Compose Compiler Maven
# https://androidx.dev/storage/compose-compiler/repository/

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose = "1.12.1"
room = "2.8.5"

# miuix-blur：液态玻璃底栏的真实背景采样（rememberLayerBackdrop / layerBackdrop）
# 与折射宿主（drawBackdrop / BackdropEffectScope）。
#
# 版本 0.9.3 取自 NPatch 的 manager 模块（top.yukonga.miuix.kmp:miuix-blur:0.9.3）——
# 它是实证可用的组合：NPatch 用 Kotlin 2.4.20 + compose-bom 2025.12.01（≈1.12.x），
# 与本仓 Kotlin 2.4.20 / compose 1.12.1 完全一致。
# Maven Central 上另有 0.9.4（2026-09-20），但其 release notes 明列 backdrop API
# 有 breaking change，故此处保持与 NPatch 对齐的 0.9.3。
miuixBlur = "0.9.3"

accompanist = "0.36.0"
# 经典 Xposed 模块 API（LSPosed / LSPatch 均兼容）
xposed = "82"
rikka-shizuku = "13.1.5"
koin = "4.2.2"

[plugins]
agp-lib = { id = "com.android.library", version.ref = "agp" }
agp-app = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# KSP quickstart
# https://kotlinlang.org/docs/ksp-quickstart.html
ksp = { id = "com.google.devtools.ksp", version = "2.3.12" }

[libraries]
androidx-annotation = { group = "androidx.annotation", name = "annotation", version = "1.11.0" }
androidx-core = { group = "androidx.core", name = "core-ktx", version = "1.19.1" }
androidx-lifecycle = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version = "2.11.0" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.13.0" }

compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version = "2.10.2" }
compose-materialIcons = { group = "androidx.compose.material", name = "material-icons-extended", version = "1.7.8" }
material = { group = "com.google.android.material", name = "material", version = "1.14.0" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version = "1.4.0" }

# miuix-blur 可独立引入（不依赖 miuix-ui，因此不需要换掉 MaterialTheme）。
miuix-blur = { group = "top.yukonga.miuix.kmp", name = "miuix-blur", version.ref = "miuixBlur" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# Koin Inject
# https://insert-koin.io/docs/setup/koin
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

# Pager layouts
# https://google.github.io/accompanist/pager/
accompanist-pager = { group = "com.google.accompanist", name = "accompanist-pager", version.ref = "accompanist" }
accompanist-navigationAnimation = { group = "com.google.accompanist", name = "accompanist-navigation-animation", version.ref = "accompanist" }
accompanist-flowlayout = { group = "com.google.accompanist", name = "accompanist-flowlayout", version.ref = "accompanist" }
accompanist-drawablepainter = { group = "com.google.accompanist", name = "accompanist-drawablepainter", version = "0.37.3" }
accompanist-systemuicontroller = { group = "com.google.accompanist", name = "accompanist-systemuicontroller", version.ref = "accompanist" }
xposed-api = { group = "de.robv.android.xposed", name = "api", version.ref = "xposed" }

# AndroidHiddenApiBypass
# https://github.com/LSPosed/AndroidHiddenApiBypass
lsposed-hiddenapibypass = { group = "org.lsposed.hiddenapibypass", name = "hiddenapibypass", version = "6.1" }

# Rikka Shizuku
# https://github.com/RikkaApps/Shizuku-API
rikka-shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "rikka-shizuku" }
rikka-shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "rikka-shizuku" }

# Dhizuku-API
# https://github.com/iamr0s/Dhizuku-API
# C-06：已改为本地源码模块依赖（见 settings.gradle.kts 的 :Dhizuku-SERVER_API），
# 不再从 Maven 拉取。保留这行仅为回退备用，当前代码里已不再引用。
iamr0s-dhizuku-api = { group = "io.github.iamr0s", name = "Dhizuku-SERVER_API", version = "0.1.0" }

# ---------------------------------------------------------------------------
# 以下三项是 Dhizuku-API 两个模块（作为本地 subproject 引入）所需的依赖。
# 它们原本定义在 Dhizuku-API/gradle/libs.versions.toml 中；
# 作为主仓 subproject 后，版本目录统一使用主仓这一份，
# 因此必须在此补齐同名 alias，否则会报 "Could not find libs.appprocess" 之类错误。
#
# 注意 alias 名必须与 Dhizuku-API/*/build.gradle 中的引用完全一致：
#   libs.appprocess / libs.annotation / libs.core
# ---------------------------------------------------------------------------
appprocess = { group = "io.github.iamr0s", name = "AndroidAppProcess", version = "1.4.3" }
annotation = { group = "androidx.annotation", name = "annotation", version = "1.11.0" }
core = { group = "androidx.core", name = "core", version = "1.19.1" }
